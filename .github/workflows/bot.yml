name: Run asituff

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Public Workflow Repo
      uses: actions/checkout@v4

    - name: Clone Private Repository Code
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        git clone https://x-access-token:${GH_PAT}@github.com/ere4n/asituff.git private_repo

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "python-telegram-bot[all]" requests
        if [ -f private_repo/requirements.txt ]; then pip install -r private_repo/requirements.txt; fi

    - name: Run Private Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        python "private_repo/dark_tuff.py"
        
